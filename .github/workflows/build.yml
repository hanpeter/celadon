name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Matrix jobs can't expose per-leg outputs, so each image gets a hard-coded output; keep in sync with the matrix and release body
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest-celadon: ${{ steps.export-digest.outputs.digest-celadon }}
      digest-celadon-migrator: ${{ steps.export-digest.outputs.digest-celadon-migrator }}
    strategy:
      matrix:
        include:
          - name: celadon
            image: hanpeter/celadon
            file: docker/celadon/Dockerfile
            cache-scope: celadon
          - name: celadon-migrator
            image: hanpeter/celadon-migrator
            file: docker/celadon-migrator/Dockerfile
            cache-scope: celadon-migrator
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            # priority=1000 so {{version}} becomes steps.meta.outputs.version; the other semver lines tie at 900 and tie-breaking is undocumented
            type=semver,pattern={{version}},priority=1000,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      - name: Docker Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || '0.0.0' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
      - name: Export image digest
        id: export-digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest-${{ matrix.name }}=${DIGEST}" >> "${GITHUB_OUTPUT}"

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          # Images are hard-coded (see build outputs); keep in sync with the build matrix
          body: |
            ## Docker images

            ### celadon

            Published to `ghcr.io/${{ github.repository }}`.

            ```sh
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest-celadon }}
            ```

            **Digest:** `${{ needs.build.outputs.digest-celadon }}`

            ### celadon-migrator

            Published to `ghcr.io/${{ github.repository }}-migrator`.

            ```sh
            docker pull ghcr.io/${{ github.repository }}-migrator:${{ needs.build.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}-migrator@${{ needs.build.outputs.digest-celadon-migrator }}
            ```

            **Digest:** `${{ needs.build.outputs.digest-celadon-migrator }}`

  migrate:
    name: Apply DB migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions: {}
    concurrency:
      group: migrate-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Apply yoyo migrations on a one-off Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}-migrator:${VERSION}"
          echo "Running migrations using image: ${IMAGE}"
          flyctl machine run "${IMAGE}" \
            -a celadon \
            --rm \
            --command "apply"

  deploy:
    name: Deploy to Fly.io
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy
        run: flyctl deploy --image "ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
